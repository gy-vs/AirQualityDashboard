<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市空气质量监控仪表盘 | Air Quality Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/map/js/china.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                </div>
                <h1>空气质量监控</h1>
                <p class="text-muted small mb-0">实时数据 · 智能预警</p>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-link active" onclick="showPage('ranking', this)">
                    <span class="nav-icon">📊</span>
                    <span>AQI排行榜</span>
                </a>
                <a href="#" class="nav-link" onclick="showPage('map', this)">
                    <span class="nav-icon">🗺️</span>
                    <span>地图热力图</span>
                </a>
                <a href="#" class="nav-link" onclick="showPage('history', this)">
                    <span class="nav-icon">📈</span>
                    <span>历史趋势</span>
                </a>
            </nav>
            
            <div class="sidebar-footer mt-auto">
                <div class="update-indicator">
                    <span class="pulse-dot"></span>
                    <small id="update-time">实时更新中...</small>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h2 id="page-title">全国城市AQI排行</h2>
                </div>
                <div class="header-right">
                    <div class="summary-stats">
                        <div class="stat-card mini">
                            <span class="stat-label">监控城市</span>
                            <span class="stat-value">30</span>
                        </div>
                        <div class="stat-card mini">
                            <span class="stat-label">更新频率</span>
                            <span class="stat-value">10s</span>
                        </div>
                    </div>
                </div>
            </header>

            <div id="alert-banner" class="alert-banner alert-danger d-none">
                <div class="alert-content">
                    <span class="alert-icon">⚠️</span>
                    <div>
                        <strong>污染预警！</strong>
                        <p id="alert-message" class="mb-0">多个城市AQI指数已超过200，请关注空气质量状况！</p>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" onclick="this.parentElement.classList.add('d-none')"></button>
            </div>

            <div class="content-area">
                <div id="page-ranking" class="page">
                    <div class="filter-bar mb-4">
                        <div class="d-flex align-items-center gap-3">
                            <label class="form-label mb-0">省份筛选：</label>
                            <div class="select-wrapper">
                                <select id="province-filter" class="form-select" onchange="loadAQIRanking()">
                                    <option value="">全部省份</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card dashboard-card">
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table ranking-table" id="ranking-table">
                                    <thead>
                                        <tr>
                                            <th>排名</th>
                                            <th>城市</th>
                                            <th>省份</th>
                                            <th>AQI指数</th>
                                            <th>空气质量等级</th>
                                            <th>PM2.5</th>
                                            <th>PM10</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="ranking-tbody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="page-map" class="page d-none">
                    <div class="card dashboard-card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">全国AQI热力图分布</h5>
                            <p class="text-muted small mb-0">点击地图可拖拽缩放，查看各地区详情</p>
                        </div>
                        <div class="card-body">
                            <div id="china-map" class="chart-container"></div>
                        </div>
                    </div>
                </div>

                <div id="page-city-detail" class="page d-none">
                    <div class="city-detail-header mb-4">
                        <h3 id="city-name" class="mb-2">城市名称</h3>
                        <div class="city-badges" id="city-badges"></div>
                    </div>
                    
                    <div class="row g-4">
                        <div class="col-lg-6">
                            <div class="card dashboard-card chart-card h-100">
                                <div class="card-header">
                                    <h6>24小时污染物浓度趋势</h6>
                                </div>
                                <div class="card-body">
                                    <div id="trend-chart" class="chart-container"></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="card dashboard-card chart-card h-100">
                                <div class="card-header">
                                    <h6>7天AQI平均值变化</h6>
                                </div>
                                <div class="card-body">
                                    <div id="aqi-weekly-chart" class="chart-container"></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-6 mx-auto">
                            <div class="card dashboard-card chart-card">
                                <div class="card-header">
                                    <h6>污染物浓度雷达图</h6>
                                </div>
                                <div class="card-body">
                                    <div id="radar-chart" class="chart-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="page-history" class="page d-none">
                    <div class="card dashboard-card mb-4">
                        <div class="card-body">
                            <div class="row g-3 align-items-end">
                                <div class="col-md">
                                    <label class="form-label">选择城市</label>
                                    <div class="select-wrapper">
                                        <select id="history-city" class="form-select">
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md">
                                    <label class="form-label">开始日期</label>
                                    <input type="date" id="start-date" class="form-control">
                                </div>
                                <div class="col-md">
                                    <label class="form-label">结束日期</label>
                                    <input type="date" id="end-date" class="form-control">
                                </div>
                                <div class="col-md-auto d-flex gap-2">
                                    <button class="btn btn-primary btn-lg px-4" onclick="loadHistoryData()">
                                        <span>🔍</span> 查询数据
                                    </button>
                                    <button class="btn btn-outline-success btn-lg px-4" onclick="exportCSV()">
                                        <span>📥</span> 导出CSV
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card dashboard-card">
                        <div class="card-body">
                            <div id="history-chart" class="chart-container tall"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
