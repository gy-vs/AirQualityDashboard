<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}城市空气质量监控仪表盘{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/map/js/china.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
        }
        
        /* 顶部导航 */
        .navbar {
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            color: white;
            padding: 0 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }
        
        .logo {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .nav-links {
            display: flex;
            gap: 30px;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background 0.3s;
            font-size: 15px;
        }
        
        .nav-links a:hover, .nav-links a.active {
            background: rgba(255,255,255,0.2);
        }
        
        /* 预警横幅 */
        .alert-banner {
            padding: 12px 20px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        
        .alert-banner.severe {
            background: #ffebee;
            color: #c62828;
            border-bottom: 2px solid #ef5350;
        }
        
        .alert-banner.warning {
            background: #fff3e0;
            color: #e65100;
            border-bottom: 2px solid #ff9800;
        }
        
        .alert-banner.show {
            display: block;
        }
        
        /* 主内容区 */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 卡片样式 */
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a237e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* AQI等级颜色 */
        .aqi-excellent { color: #00e400; }
        .aqi-good { color: #ffcc00; }
        .aqi-mild { color: #ff7e00; }
        .aqi-moderate { color: #ff0000; }
        .aqi-severe { color: #99004c; }
        .aqi-serious { color: #7e0023; }
        
        .aqi-bg-excellent { background: #00e400; color: white; }
        .aqi-bg-good { background: #ffcc00; color: #333; }
        .aqi-bg-mild { background: #ff7e00; color: white; }
        .aqi-bg-moderate { background: #ff0000; color: white; }
        .aqi-bg-severe { background: #99004c; color: white; }
        .aqi-bg-serious { background: #7e0023; color: white; }
        
        /* 按钮样式 */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: #1a73e8;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1557b0;
        }
        
        .btn-success {
            background: #4caf50;
            color: white;
        }
        
        .btn-success:hover {
            background: #45a049;
        }
        
        /* 表格样式 */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .data-table th {
            background: #f5f5f5;
            font-weight: 600;
            color: #555;
        }
        
        .data-table tr:hover {
            background: #f8f9fa;
        }
        
        .data-table a {
            color: #1a73e8;
            text-decoration: none;
        }
        
        .data-table a:hover {
            text-decoration: underline;
        }
        
        /* AQI徽章 */
        .aqi-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            min-width: 50px;
            text-align: center;
        }
        
        /* 筛选器 */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-bar select,
        .filter-bar input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        /* 图表容器 */
        .chart-container {
            width: 100%;
            height: 400px;
        }
        
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }
        
        /* 页脚 */
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #e0e0e0;
            margin-top: 40px;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .navbar-content {
                flex-direction: column;
                height: auto;
                padding: 10px 0;
            }
            
            .nav-links {
                gap: 10px;
                margin-top: 10px;
            }
            
            .main-content {
                padding: 10px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 预警横幅 -->
    <div id="alertBanner" class="alert-banner">
        <span id="alertText"></span>
    </div>
    
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-content">
            <div class="logo">
                <div class="logo-icon">🌍</div>
                <span>空气质量监控仪表盘</span>
            </div>
            <div class="nav-links">
                <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">实时监控</a>
                <a href="/history" class="{% if request.url.path == '/history' %}active{% endif %}">历史数据</a>
            </div>
        </div>
    </nav>
    
    <!-- 主内容 -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <!-- 页脚 -->
    <footer class="footer">
        <p>城市空气质量监控仪表盘 &copy; 2024 | 数据仅供演示使用</p>
    </footer>
    
    <script>
        // 检查预警信息
        async function checkAlerts() {
            try {
                const response = await fetch('/api/alerts');
                const data = await response.json();
                
                const banner = document.getElementById('alertBanner');
                const text = document.getElementById('alertText');
                
                if (data.has_severe) {
                    const cities = data.severe.map(s => `${s.city}(AQI:${s.aqi})`).join('、');
                    text.textContent = `⚠️ 严重污染预警：${cities} - 建议避免户外活动`;
                    banner.className = 'alert-banner severe show';
                } else if (data.has_warning) {
                    const cities = data.warning.map(w => `${w.city}(AQI:${w.aqi})`).join('、');
                    text.textContent = `⚡ 中度污染提醒：${cities} - 敏感人群请注意防护`;
                    banner.className = 'alert-banner warning show';
                } else {
                    banner.className = 'alert-banner';
                }
            } catch (error) {
                console.error('获取预警信息失败:', error);
            }
        }
        
        // 页面加载时检查预警
        checkAlerts();
        // 每30秒更新一次
        setInterval(checkAlerts, 30000);
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
