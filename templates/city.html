<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ city_name }} - 空气质量详情</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 10px; margin-bottom: 20px; }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .back-link { color: #4ecdc4; text-decoration: none; font-size: 16px; }
        .back-link:hover { text-decoration: underline; }
        .summary-bar { display: flex; justify-content: center; gap: 50px; padding: 20px; background: rgba(255,255,255,0.03); border-radius: 10px; margin-bottom: 20px; }
        .summary-item { text-align: center; }
        .summary-item .value { font-size: 36px; font-weight: bold; }
        .summary-item .label { font-size: 14px; color: #888; margin-top: 5px; }
        .content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 20px; }
        .panel h2 { font-size: 18px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .chart { width: 100%; height: 350px; }
        .pollutant-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .pollutant-item { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 15px; text-align: center; }
        .pollutant-item .name { font-size: 14px; color: #888; }
        .pollutant-item .value { font-size: 28px; font-weight: bold; margin: 5px 0; }
        .pollutant-item .unit { font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-link">← 返回仪表盘首页</a>
            <h1 id="cityTitle">{{ city_name }} 空气质量详情</h1>
        </div>
        
        <div class="summary-bar" id="summaryBar">
            <div class="summary-item"><div class="value" id="currentAqi">-</div><div class="label">当前 AQI</div></div>
            <div class="summary-item"><div class="value" id="currentLevel">-</div><div class="label">空气质量等级</div></div>
            <div class="summary-item"><div class="value" id="avg24h">-</div><div class="label">24小时平均 AQI</div></div>
            <div class="summary-item"><div class="value" id="max7d">-</div><div class="label">7天最高 AQI</div></div>
        </div>
        
        <div class="panel">
            <h2>🎯 当前污染物浓度</h2>
            <div class="pollutant-list" id="pollutantList">
            </div>
        </div>
        
        <div class="content" style="margin-top: 20px;">
            <div class="panel">
                <h2>📈 24小时污染物浓度变化趋势</h2>
                <div class="chart" id="trendChart"></div>
            </div>
            <div class="panel">
                <h2>🎯 污染物占比雷达图</h2>
                <div class="chart" id="radarChart"></div>
            </div>
            <div class="panel">
                <h2>📊 最近7天 AQI 变化</h2>
                <div class="chart" id="weekChart"></div>
            </div>
            <div class="panel">
                <h2>💡 说明</h2>
                <ul style="line-height: 2; color: #aaa; padding-left: 20px;">
                    <li><strong style="color: #4ecdc4;">PM2.5</strong>：细颗粒物，对人体健康影响最大的污染物之一</li>
                    <li><strong style="color: #4ecdc4;">PM10</strong>：可吸入颗粒物，影响呼吸系统</li>
                    <li><strong style="color: #4ecdc4;">SO2</strong>：二氧化硫，主要来源于燃煤</li>
                    <li><strong style="color: #4ecdc4;">NO2</strong>：二氧化氮，机动车尾气贡献显著</li>
                    <li><strong style="color: #4ecdc4;">CO</strong>：一氧化碳，影响氧气输送</li>
                    <li><strong style="color: #4ecdc4;">O3</strong>：臭氧，光化学烟雾主要成分</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const cityName = "{{ city_name }}";
        let trendChart, radarChart, weekChart;
        
        function initCharts() {
            trendChart = echarts.init(document.getElementById('trendChart'));
            radarChart = echarts.init(document.getElementById('radarChart'));
            weekChart = echarts.init(document.getElementById('weekChart'));
        }
        
        function getLevelInfo(aqi) {
            if (aqi <= 50) return { name: '优', color: '#00e400' };
            if (aqi <= 100) return { name: '良', color: '#ffff00' };
            if (aqi <= 150) return { name: '轻度污染', color: '#ff7e00' };
            if (aqi <= 200) return { name: '中度污染', color: '#ff0000' };
            if (aqi <= 300) return { name: '重度污染', color: '#99004c' };
            return { name: '严重污染', color: '#7e0023' };
        }
        
        async function loadCurrentData() {
            const res = await fetch('/api/latest');
            const data = await res.json();
            const cityData = data.find(d => d.city_name === cityName);
            if (cityData) {
                const level = getLevelInfo(cityData.aqi);
                document.getElementById('currentAqi').textContent = cityData.aqi;
                document.getElementById('currentAqi').style.color = level.color;
                document.getElementById('currentLevel').textContent = level.name;
                document.getElementById('currentLevel').style.color = level.color;
                
                const listHtml = `
                    <div class="pollutant-item"><div class="name">PM2.5</div><div class="value">${cityData.pm25}</div><div class="unit">μg/m³</div></div>
                    <div class="pollutant-item"><div class="name">PM10</div><div class="value">${cityData.pm10}</div><div class="unit">μg/m³</div></div>
                    <div class="pollutant-item"><div class="name">SO₂</div><div class="value">${cityData.so2}</div><div class="unit">μg/m³</div></div>
                    <div class="pollutant-item"><div class="name">NO₂</div><div class="value">${cityData.no2}</div><div class="unit">μg/m³</div></div>
                    <div class="pollutant-item"><div class="name">CO</div><div class="value">${cityData.co}</div><div class="unit">mg/m³</div></div>
                    <div class="pollutant-item"><div class="name">O₃</div><div class="value">${cityData.o3}</div><div class="unit">μg/m³</div></div>
                `;
                document.getElementById('pollutantList').innerHTML = listHtml;
            }
        }
        
        async function load24hTrend() {
            const res = await fetch(`/api/city/${encodeURIComponent(cityName)}/24h`);
            const data = await res.json();
            
            const option = {
                tooltip: { trigger: 'axis' },
                legend: { data: ['PM2.5', 'PM10', 'SO2', 'NO2', 'O3'], top: 10, textStyle: { color: '#888' } },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: data.timestamps, axisLine: { lineStyle: { color: '#444' } }, axisLabel: { color: '#888', fontSize: 10 } },
                yAxis: { type: 'value', name: 'μg/m³', nameTextStyle: { color: '#888' }, axisLine: { lineStyle: { color: '#444' } }, axisLabel: { color: '#888' }, splitLine: { lineStyle: { color: '#222' } } },
                series: [
                    { name: 'PM2.5', type: 'line', smooth: true, data: data.pm25, lineStyle: { width: 3 }, symbol: 'none' },
                    { name: 'PM10', type: 'line', smooth: true, data: data.pm10, lineStyle: { width: 2 }, symbol: 'none' },
                    { name: 'SO2', type: 'line', smooth: true, data: data.so2, symbol: 'none' },
                    { name: 'NO2', type: 'line', smooth: true, data: data.no2, symbol: 'none' },
                    { name: 'O3', type: 'line', smooth: true, data: data.o3, symbol: 'none' },
                ]
            };
            trendChart.setOption(option);
            
            const allAqi = [...data.pm25, ...data.pm10];
            const avg = allAqi.reduce((a,b) => a + b, 0) / allAqi.length;
            document.getElementById('avg24h').textContent = Math.round(avg);
        }
        
        async function load7dChart() {
            const res = await fetch(`/api/city/${encodeURIComponent(cityName)}/7d`);
            const data = await res.json();
            
            const colors = data.avg_aqi.map(val => {
                if (val <= 50) return '#00e400';
                if (val <= 100) return '#ffff00';
                if (val <= 150) return '#ff7e00';
                if (val <= 200) return '#ff0000';
                return '#99004c';
            });
            
            const option = {
                tooltip: { trigger: 'axis' },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: { type: 'category', data: data.dates, axisLine: { lineStyle: { color: '#444' } }, axisLabel: { color: '#888' } },
                yAxis: { type: 'value', name: 'AQI', nameTextStyle: { color: '#888' }, axisLine: { lineStyle: { color: '#444' } }, axisLabel: { color: '#888' }, splitLine: { lineStyle: { color: '#222' } } },
                series: [{
                    type: 'bar',
                    data: data.avg_aqi.map((val, idx) => ({ value: val, itemStyle: { color: colors[idx] } })),
                    barWidth: '50%',
                    label: { show: true, position: 'top', color: '#888', fontSize: 12 }
                }]
            };
            weekChart.setOption(option);
            
            document.getElementById('max7d').textContent = Math.max(...data.max_aqi);
        }
        
        async function loadRadarChart() {
            const res = await fetch(`/api/city/${encodeURIComponent(cityName)}/radar`);
            const data = await res.json();
            
            const option = {
                tooltip: {},
                legend: { data: ['当前值'], bottom: 10, textStyle: { color: '#888' } },
                radar: { indicator: data.indicators, axisName: { color: '#888' }, splitArea: { areaStyle: { color: 'rgba(255,255,255,0.02)' } }, axisLine: { lineStyle: { color: '#333' } }, splitLine: { lineStyle: { color: '#222' } } },
                series: [{
                    type: 'radar',
                    data: [{ value: data.values, name: '当前值', areaStyle: { color: 'rgba(78, 205, 196, 0.3)' }, lineStyle: { color: '#4ecdc4', width: 2 } }]
                }]
            };
            radarChart.setOption(option);
        }
        
        function init() {
            initCharts();
            loadCurrentData();
            load24hTrend();
            load7dChart();
            loadRadarChart();
            
            window.addEventListener('resize', () => {
                trendChart.resize();
                radarChart.resize();
                weekChart.resize();
            });
        }
        
        init();
    </script>
</body>
</html>
